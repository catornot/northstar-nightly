
name: Northstar Nightly

on:
  schedule:
  - cron: "0 3 */2 * *" # every 2 days at 03:00 UTC
  workflow_dispatch:

jobs:
  make-nightly-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          # We don't enable ca-derivations here
          # because we have later jobs where ca-derivations is enabled.
          nix_conf: |
            experimental-features = nix-command flakes

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          # restore and save a cache using this key
          # don't include lock in hash since it will differ most of the time
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 2G
          # do purge caches
          purge: false
          # purge all versions of the cache
          purge-prefixes: nix-${{ runner.os }}-
          # created more than this number of seconds ago
          purge-created: 0
          # or, last accessed more than this number of seconds ago
          # relative to the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: 604800
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never

      - name: Build
        run: nix build .#northstar

      - name: Prepare artifact
        run: |
          mkdir upload
          cp -r result/* upload/
          tar -czf northstar-nightly.tar.gz -C upload .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: northstar-nightly
          path: northstar-nightly.tar.gz

      - name: Generate tag
        id: tag
        run: echo "tag=nightly-$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Update Nightly Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: Nightly ${{ steps.tag.outputs.tag }}
          draft: false
          body: |
            This is a nightly release of northstar
            It's unstable compared to the official releases, **use it with caution**!
          files: northstar-nightly.tar.gz
